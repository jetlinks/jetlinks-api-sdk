name: Publish Maven snapshots

on:
  push:
    branches: ['2.0', master]
  workflow_dispatch:

permissions:
  contents: read

# 两个分支使用相同快照坐标，串行部署且不取消正在上传的 reactor。
concurrency:
  group: maven-snapshots
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'jetlinks/jetlinks-api-sdk' &&
      (github.ref == 'refs/heads/2.0' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: snapshots
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
      - name: Verify and publish SDK snapshots
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
        run: |
          if [[ -z "$MAVEN_USERNAME" || -z "$MAVEN_PASSWORD" ]]; then
            echo '::error::Configure MAVEN_USERNAME and MAVEN_PASSWORD secrets.'
            exit 1
          fi
          mvn -B -ntp -q org.apache.maven.plugins:maven-help-plugin:3.5.1:evaluate \
            -Dexpression=project.version -Doutput="$RUNNER_TEMP/sdk-version"
          sdk_version="$(cat "$RUNNER_TEMP/sdk-version")"
          case "$sdk_version" in
            *-SNAPSHOT) ;;
            *) echo '::error::This workflow only publishes SNAPSHOT versions.'; exit 1 ;;
          esac
          python3 tools/check-dependencies.py
          mvn -B -ntp -Ppublish \
            -pl sdk-java/sdk-client-core,sdk-java/sdk-client-spring-boot-starter -am clean deploy
