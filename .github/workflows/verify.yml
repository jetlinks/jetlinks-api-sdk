name: verify
on: [push, pull_request]
jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17', cache: maven}
      - run: mvn -B verify
      - run: python3 tools/check-dependencies.py
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17', cache: maven}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: examples/shared-ui/package-lock.json}
      - run: npm ci && npm run typecheck && npm run lint && npm run build
        working-directory: examples/shared-ui
      - run: mvn -B package -DskipTests
      - run: node examples/smoke/local-test.mjs
