[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "jetlinks-sdk-client"
version = "2.0.0a0"
description = "JetLinks API 与第三方应用客户端"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1", "cryptography>=44,<49", "simplejson>=3.20,<4"]

[project.optional-dependencies]
example = ["starlette>=0.47,<1", "uvicorn>=0.35,<1"]
test = ["pytest>=8,<10", "pytest-asyncio>=0.26,<2", "build>=1.2,<2", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/jetlinks_sdk_client"]

[tool.ruff.lint]
select = ["F"]

[tool.ruff.lint.per-file-ignores]
"src/jetlinks_sdk_client/__init__.py" = ["F401", "F403"]
